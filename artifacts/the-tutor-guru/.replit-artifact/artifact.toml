kind = "web"
previewPath = "/"
title = "TheTutorGuru"
description = "South African high-school tutoring, built with MudBlazor and ASP.NET Core Identity."
version = "1.0.0"
id = "artifacts/the-tutor-guru"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 25958

[services.development]
run = "pnpm --filter @workspace/the-tutor-guru run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/the-tutor-guru", "run", "build"]

[services.production.run]
args = ["pnpm", "--filter", "@workspace/the-tutor-guru", "run", "serve"]

[services.production.run.env]
PORT = "25958"
ASPNETCORE_ENVIRONMENT = "Production"

[services.env]
PORT = "25958"
BASE_PATH = "/"
